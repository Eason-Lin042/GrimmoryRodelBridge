name: Check
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, test_flags: '-race'}
          - {os: windows-latest, test_flags: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'
      - name: Static checks and probe tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          python -m unittest discover -s dev -p 'test_*.py'
          node --check internal/adapter/web/app.js
      - name: Go tests
        run: go test ${{ matrix.test_flags }} ./...
